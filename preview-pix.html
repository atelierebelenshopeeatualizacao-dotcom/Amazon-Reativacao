<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia da tela PIX</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:Roboto,"Helvetica Neue",Arial,sans-serif}.app{width:100%;max-width:650px;min-height:100vh;margin:auto;background:#fff}.top{height:108px;background:#efbb83;display:flex;align-items:center;padding:0 44px;gap:26px;white-space:nowrap}.back{font-size:36px;color:#40160e}.top strong{font-size:29px;overflow:hidden;text-overflow:ellipsis}.strip{height:80px;background:#263341}.body{text-align:center;padding:46px 24px 24px}.total{font-size:28px;font-weight:700;margin:0 0 64px}.qr{width:220px;height:220px;object-fit:contain;margin:0 auto 54px;display:block}.title{font-size:27px;font-weight:700;margin:0 0 18px}.desc{font-size:24px;line-height:1.42;margin:0 0 40px}.warn,.timer{font-size:24px;line-height:1.3;margin:0 0 30px}.timer{margin-bottom:54px}.btn{height:76px;width:100%;max-width:580px;border-radius:42px;font-size:25px;display:block;margin:0 auto}.copy{background:#ffda18;border:0;outline:3px solid #bcbcbc;outline-offset:3px;box-shadow:0 0 0 5px #fff,0 0 0 7px #d0d0d0}.cancel{margin-top:24px;background:#fff;border:2px solid #aaa}@media(max-width:500px){.top{height:10dvh;min-height:58px;padding:0 18px;gap:12px}.top strong{font-size:clamp(17px,4.6vw,23px)}.back{font-size:28px}.strip{height:8dvh;min-height:45px}.body{height:calc(100dvh - 18dvh);padding:2.3dvh 4vw 1dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:0;overflow:hidden}.total{font-size:clamp(16px,3.5dvh,22px);margin:0}.qr{width:min(52vw,23dvh,220px);height:min(52vw,23dvh,220px);margin:0}.title{font-size:clamp(15px,3.3dvh,21px);margin:0}.desc{font-size:clamp(12px,2.8dvh,19px);line-height:1.25;margin:0}.warn,.timer{font-size:clamp(13px,2.9dvh,19px);margin:0}.btn{height:clamp(38px,6.4dvh,56px);font-size:clamp(14px,3.2dvh,20px)}.cancel{margin-top:0}}</style></head><body><div class="app"><header class="top"><span class="back">←</span><strong>Autorizar forma de pagamento</strong></header><div class="strip"></div><main class="body"><p class="total">Total a pagar: R$ 20,00</p><img class="qr" src="pix-qr-preview.png" alt="QR Code PIX"><h2 class="title">Escaneie ou copie o código para pagar</h2><p class="desc">Escaneie o QR code com a câmera do seu celular para pagar no aplicativo do seu banco ou copie o código clicando no botão abaixo.</p><p class="warn">Não atualize a página.</p><p class="timer">Tempo restante: <b>10:00</b></p><button class="btn copy">Copiar código</button><button class="btn cancel">Cancelar pedido</button></main></div></body></html>
